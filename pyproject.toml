[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pwa-pantry-recipes"
version = "0.1.0"
description = "Local PWA for recipe browsing, pantry matching, and daily-note cooking logs"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "PyYAML>=6,<7", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1", "aiosqlite>=0.20"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-timeout>=2.3,<3"]
dev = ["mypy>=1.13,<2", "ruff>=0.8,<1", "types-PyYAML>=6,<7"]
# The two browser flows need a browser binary on the runner, so they stay
# opt-in: CI installs ".[test,dev]" and never pays for them.
browser = ["playwright>=1.44"]

[tool.setuptools]
# Auto-discovery, not a hand-maintained list. An explicit `packages` list is a
# silent-green trap: a subpackage a ticket forgot to register still yields a
# wheel, and CI's wheel check still passes because it only lists what it knows
# about. Discovery removes the per-ticket registration step entirely.
# `namespaces = false` restricts the result to directories carrying an
# `__init__.py`, so `app/static` stays a data directory rather than becoming a
# package, and no `__pycache__` can match.
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[tool.setuptools.package-data]
# Every key names a package that exists on disk, and every glob matches at
# least one real file. A glob that silently matches nothing ships nothing while
# the build still succeeds, so `tests/scaffold/test_app.py` asserts both of
# those resolve. Dotted keys MUST stay quoted: an unquoted `app.recipes` tries
# to add a sub-key to the already-defined `app` table and the whole file fails
# to parse.
#
# One entry per directory, one level deep. `static/js/*` matches `main.js` plus
# the `logic/` and `pwa/` *directories* -- glob `*` does not cross a `/` -- so
# it ships neither directory's contents. Each subdirectory therefore needs its
# own entry; omitting one produces a wheel that 404s the file offline while the
# build still reports success.
app = [
    "static/*",
    "static/css/*",
    "static/js/*",
    "static/js/logic/*",
    "static/js/pwa/*",
    "static/js/views/*",
    "static/icons/*",
]
"app.recipes" = ["lexicon/*.yaml"]
"app.pantry" = ["line_overrides.yaml"]
"app.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A hung run is the one leak the parent-death guards cannot catch: they key off
# the parent dying, and a hang keeps it alive. This converts a hang into an
# ordinary failure, so every `finally` runs and the suite continues. 120s is a
# hang detector, not a budget.
timeout = 120
# Signal-based: raises inside the test so cleanup unwinds normally. The thread
# method would hard-exit the whole process and skip exactly that cleanup.
timeout_method = "signal"

[tool.ruff]
target-version = "py312"
line-length = 100
# `build/` is a git-ignored stale duplicate of the app tree, written by
# `pip wheel .` and never cleaned by it. It is not source, so a lint finding
# there is a finding about a deleted copy of a line. Ruff's DEFAULT exclude
# already skips it while walking a directory -- but a default `exclude` applies
# only to files discovered by traversal. A file named on the command line is
# checked whether or not it is excluded, unless `force-exclude` is set, which is
# why this is stated rather than inherited: `ruff check build` used to lint the
# stale copy even with no config change at all.
extend-exclude = ["build"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
