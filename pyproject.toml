[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pwa-pantry-recipes"
version = "0.1.0"
description = "Local PWA for recipe browsing, pantry matching, and daily-note cooking logs"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "PyYAML>=6,<7", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-timeout>=2.3,<3"]
dev = ["mypy>=1.13,<2", "ruff>=0.8,<1", "types-PyYAML>=6,<7"]

[tool.setuptools]
# Scaffold modules only. `app.vault` / `app.pantry` / `app.recipes` are created
# with the feature implementation, not before.
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["static/*", "static/css/*", "static/js/*", "static/js/pwa/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A hung run is the one leak the parent-death guards cannot catch: they key off
# the parent dying, and a hang keeps it alive. This converts a hang into an
# ordinary failure, so every `finally` runs and the suite continues. 120s is a
# hang detector, not a budget.
timeout = 120
# Signal-based: raises inside the test so cleanup unwinds normally. The thread
# method would hard-exit the whole process and skip exactly that cleanup.
timeout_method = "signal"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
