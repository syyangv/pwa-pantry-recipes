<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Option A (docs/pwa-template.md 2a): full-bleed interactive PWA.
         viewport-fit=cover is mandatory — without it env(safe-area-inset-*)
         silently returns 0 everywhere. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <!-- Injected at serve time from sw.js CACHE_VERSION (single source of
         truth) — see the "/" route in app/main.py. A meta tag, not an inline
         script, so the shell stays CSP-clean. -->
    <meta name="app-version" content="__APP_VERSION__">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- iOS Home Screen metadata. icon-180-apple.png is committed and generated
         by scripts/generate_icons.py; it is unversioned, so a later icon change
         needs the Home Screen app removed and re-added (iOS caches manifest
         metadata longer than page content). -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pantry Recipes">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180-apple.png">
    <link rel="stylesheet" href="/css/pwa.css?v=__APP_VERSION__">
    <link rel="stylesheet" href="/css/tokens.css?v=__APP_VERSION__">
    <link rel="stylesheet" href="/css/styles.css?v=__APP_VERSION__">
    <title>Pantry Recipes</title>
  </head>
  <body>
    <div class="sticky-header">
      <header class="topbar">
        <div class="hero">
          <div class="hero-mid">
            <div class="hero-eyebrow">厨房</div>
            <h1 class="hero-date">Pantry Recipes</h1>
          </div>
        </div>
        <span id="version-badge" class="version-badge" title="Pantry Recipes — local service" hidden></span>
      </header>
    </div>

    <div class="banners" aria-live="polite">
      <!-- update-manager injects the update banner into #update-banner when
           a newer CACHE_VERSION is waiting. F18: the banner is EXPLICIT —
           sw.js sets WAIT_FOR_MESSAGE = true and main.js passes
           autoApply: false, so a reload never lands on its own. -->
      <aside id="update-banner"></aside>
      <aside id="route-notice" class="banner banner-notice" hidden></aside>
      <aside id="app-error" class="banner banner-error" hidden></aside>
    </div>

    <!-- The router's content root. Each view's mount(root) owns this subtree
         and its unmount() releases it; the router clears it between views. -->
    <main id="app-root" class="content">
      <section class="panel">
        <h2>连接中…</h2>
        <p class="muted">正在启动本地服务。</p>
      </section>
    </main>

    <!-- NO inline serviceWorker.register: the vendored pwa-infra
         update-manager owns registration and the update lifecycle
         (docs/pwa-template.md Part 3c). An inline register here would create
         a second registration the manager cannot control. -->
    <script type="module" src="/js/main.js?v=__APP_VERSION__"></script>
  </body>
</html>
