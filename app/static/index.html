<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Option A (docs/pwa-template.md 2a): full-bleed interactive PWA.
         viewport-fit=cover is mandatory — without it env(safe-area-inset-*)
         silently returns 0 everywhere. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <!-- Injected at serve time from sw.js CACHE_VERSION (single source of
         truth) — see the "/" route in app/main.py. A meta tag, not an inline
         script, so the shell stays CSP-clean. -->
    <meta name="app-version" content="__APP_VERSION__">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- iOS Home Screen metadata. icon-180-apple.png is committed and generated
         by scripts/generate_icons.py; it is unversioned, so a later icon change
         needs the Home Screen app removed and re-added (iOS caches manifest
         metadata longer than page content). -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pantry Recipes">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180-apple.png">
    <link rel="stylesheet" href="/css/pwa.css?v=__APP_VERSION__">
    <link rel="stylesheet" href="/css/tokens.css?v=__APP_VERSION__">
    <link rel="stylesheet" href="/css/styles.css?v=__APP_VERSION__">
    <!-- Pattern M / F19: the pull-to-refresh indicator's paint. Inert on its
         own — `.ptr-indicator` is only ever mounted by views/home.js, which is
         the ONE view initPullToRefresh() is called from. The other two views
         deliberately do not link anything for it and are excluded by the
         spec. -->
    <link rel="stylesheet" href="/css/pull-refresh.css?v=__APP_VERSION__">
    <title>Pantry Recipes</title>
  </head>
  <body>
    <div class="sticky-header">
      <header class="topbar">
        <div class="hero">
          <div class="hero-mid">
            <div class="hero-eyebrow">厨房</div>
            <h1 class="hero-date">Pantry Recipes</h1>
          </div>
        </div>
        <span id="version-badge" class="version-badge" title="Pantry Recipes — local service" hidden></span>
      </header>
    </div>

    <div class="banners" aria-live="polite">
      <!-- update-manager injects the update banner into #update-banner when
           a newer CACHE_VERSION is waiting. F18: the banner is EXPLICIT —
           sw.js sets WAIT_FOR_MESSAGE = true and main.js passes
           autoApply: false, so a reload never lands on its own. -->
      <aside id="update-banner"></aside>
      <aside id="route-notice" class="banner banner-notice" hidden></aside>
      <aside id="app-error" class="banner banner-error" hidden></aside>
    </div>

    <!-- The router's content root. Each view's mount(root) owns this subtree
         and its unmount() releases it; the router clears it between views. -->
    <main id="app-root" class="content">
      <section class="panel">
        <h2>连接中…</h2>
        <p class="muted">正在启动本地服务。</p>
      </section>
    </main>

    <!-- NO inline serviceWorker.register: the vendored pwa-infra
         update-manager owns registration and the update lifecycle
         (docs/pwa-template.md Part 3c). An inline register here would create a
         second registration the manager cannot control. -->

    <!-- THE TAB BAR. Outside #app-root on purpose: the router clears that
         subtree on every navigation, so a bar inside it would vanish on the
         first tap. Two tabs (菜谱 / 食材) and the 更多 menu that holds the other
         three routes.
         STATIC markup, not built by tabbar.js: the shell is precached, so the
         bar is on screen at first paint offline, and an <a href="#/…"> is a
         real link the router's hashchange picks up with no click handler at
         all. tabbar.js owns only the behaviour (更多's toggle, the current-tab
         mark) and `tests/js/tabbar.test.mjs` asserts these hrefs against the
         TABS table there, so the two cannot drift. -->
    <nav id="tabbar" class="tabbar" aria-label="主导航">
      <a class="tabbar__tab" href="#/" data-tab="home"><span class="tabbar__label">菜谱</span></a>
      <a class="tabbar__tab" href="#/pantry" data-tab="pantry"><span class="tabbar__label">食材</span></a>
      <button type="button" class="tabbar__tab" data-tab="more" aria-expanded="false" aria-controls="more-sheet">
        <span class="tabbar__label">更多</span>
      </button>
    </nav>

    <!-- 更多's menu. `hidden` from the start, so it is not a focusable stop on
         load, and `js/tabbar.js` is the only thing that removes it. It carries
         the vendored `.form-sheet` class so `main.js`'s F18 §4e busy-guard
         treats an open menu like an open date picker and refuses a forced
         reload underneath it. -->
    <div id="more-sheet" class="form-sheet more-sheet" hidden>
      <a class="more-sheet__link" href="#/shortlists" data-tab="shortlists">清单</a>
      <a class="more-sheet__link" href="#/provenance" data-tab="provenance">溯源</a>
      <a class="more-sheet__link" href="#/settings" data-tab="settings">调试与严格模式</a>
    </div>

    <script type="module" src="/js/main.js?v=__APP_VERSION__"></script>
  </body>
</html>
