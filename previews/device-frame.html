<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PWA Preview — [component]</title>
  <style>
    :root {
      --sat: 44px; --sar: 0px; --sab: 34px; --sal: 0px;
      --bg: #ffffff; --bg-elev: #f6f6f7; --fg: #0a0a0a;
      --fg-muted: #5a5a60; --border: #e3e3e6; --accent: #1d6fe0;
      --accent-fg: #ffffff; --radius: 12px; --tap-min: 44px;
    }
    [data-theme="dark"] {
      --bg: #0a0a0a; --bg-elev: #161618; --fg: #f5f5f7;
      --fg-muted: #a0a0a8; --border: #2a2a2e; --accent: #5aa6ff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #888; display: flex; flex-direction: column;
           align-items: center; padding: 40px 16px; gap: 24px;
           font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    .device {
      width: 390px; min-height: 844px; background: var(--bg);
      border-radius: 48px; overflow: hidden;
      box-shadow: 0 0 0 12px #1a1a1a, 0 30px 80px rgba(0,0,0,0.6);
      display: flex; flex-direction: column;
    }
    .device__status { height: var(--sat); background: var(--bg-elev);
      display: flex; align-items: flex-end; padding: 4px 24px;
      font-size: 12px; font-weight: 600; color: var(--fg); flex-shrink: 0; }
    .device__content { flex: 1; overflow-y: auto; overflow-x: clip;
      background: var(--bg); color: var(--fg); }
    .device__home { height: var(--sab); background: var(--bg);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .device__home::after { content: ''; width: 130px; height: 5px;
      background: var(--fg); opacity: 0.2; border-radius: 99px; }
    .controls { display: flex; gap: 8px; }
    .controls button { padding: 8px 16px; border-radius: 8px; border: none;
      background: white; cursor: pointer; font-size: 14px; font-weight: 600; }
    .label { font-size: 12px; color: white; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; margin: 0; }
  </style>
</head>
<body>
  <p class="label">[Component] — PWA Preview</p>
  <div class="controls">
    <button onclick="var h=document.documentElement; h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'">Toggle Dark Mode</button>
  </div>
  <div class="device">
    <div class="device__status">9:41</div>
    <div class="device__content">
      <!-- COMPONENT HTML HERE -->
    </div>
    <div class="device__home"></div>
  </div>
  <script>
    if (window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = 'dark';
  </script>
</body>
</html>
